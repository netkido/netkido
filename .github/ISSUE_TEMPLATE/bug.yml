name: Fallo / Bug
description: Algo no funciona como debería / Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Antes de enviarlo, quita claves, secretos y direcciones públicas de los logs.
        **Los problemas de seguridad no van aquí:** sigue SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: Qué pasa / What happens
      description: Qué esperabas y qué ha pasado. Pasos para reproducirlo.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versiones / Versions
      description: "`netkido --version` en el servidor y `netkido-agent status` en la sede"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Sistemas / Operating systems
      description: Servidor y sede (p. ej. Ubuntu 24.04 / Armbian 26.8 en Orange Pi 5)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl -u netkido -n 100` (servidor) y `journalctl -u netkido-agent -n 100` (sede)"
      render: text
